<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0877c9">
  <title>MT ROYAL WASH – Espace Employé</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #17324a;
      background: linear-gradient(145deg, #eaf6ff, #c8e6fb);
    }

    .login-card {
      width: 100%;
      max-width: 410px;
      padding: 34px 26px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(14, 83, 130, .13);
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-mark {
      width: 64px;
      height: 64px;
      margin: 0 auto 14px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      color: white;
      background: linear-gradient(145deg, #0787d8, #07549a);
      font-size: 25px;
      font-weight: 800;
    }

    h1 {
      margin: 0;
      color: #07549a;
      font-size: 23px;
      letter-spacing: 1px;
    }

    .subtitle {
      margin: 9px 0 0;
      color: #71869a;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d6e3ed;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #0787d8;
      box-shadow: 0 0 0 3px rgba(7, 135, 216, .12);
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      color: white;
      background: #0877c9;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 9px;
      font-size: 14px;
      line-height: 1.5;
    }

    .error {
      display: block !important;
      color: #a32626;
      background: #fff0f0;
    }

    .footer {
      margin-top: 26px;
      text-align: center;
      color: #91a1af;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="login-card">
    <header class="brand">
      <div class="brand-mark">MT</div>
      <h1>MT ROYAL WASH</h1>
      <p class="subtitle">Espace Employé</p>
    </header>

    <form id="loginForm">
      <label for="username">Nom d'utilisateur</label>
      <input
        id="username"
        type="text"
        autocomplete="username"
        placeholder="Votre identifiant"
        required
      >

      <label for="password">Mot de passe</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Votre mot de passe"
        required
      >

      <button id="loginButton" type="submit">
        Se connecter
      </button>

      <div id="message" role="alert"></div>
    </form>

    <div class="footer">
      BY MAISON TRAORÉ · Votre véhicule mérite le meilleur.
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://cgilxwdxiakfriroixih.supabase.co";
    const LOGIN_URL = SUPABASE_URL + "/functions/v1/username-login";

    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      message.className = "";
      message.textContent = "";
      message.style.display = "none";

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      if (!username || !password) {
        showError("Veuillez remplir tous les champs.");
        return;
      }

      button.disabled = true;
      button.textContent = "Connexion en cours...";

      try {
        const response = await fetch(LOGIN_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (!response.ok || !data.access_token || !data.user) {
          throw new Error(data.error || "Identifiants incorrects.");
        }

        if (data.user.role !== "employee") {
          throw new Error("Cet espace est réservé aux employés.");
        }

        sessionStorage.setItem(
          "mtRoyalWashEmployeeSession",
          JSON.stringify(data)
        );

        window.location.href = "dashboard.html";

      } catch (error) {
        showError(error.message || "Connexion impossible.");
        button.disabled = false;
        button.textContent = "Se connecter";
      }
    });

    function showError(text) {
      message.textContent = text;
      message.className = "error";
      message.style.display = "block";
    }
  </script>
</body>
</html>
