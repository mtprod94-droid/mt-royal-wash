<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0877c9">
  <title>MT ROYAL WASH – Espace Employé</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #eef7fd;
      color: #17324a;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    h1 {
      color: #07549a;
      font-size: 21px;
      margin: 0;
    }

    .subtitle {
      color: #71869a;
      font-size: 13px;
      margin-top: 5px;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 11px 14px;
      background: #0877c9;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .logout {
      background: #e9f2f8;
      color: #07549a;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 18px;
      box-shadow: 0 5px 20px rgba(14,83,130,.06);
    }

    .label {
      color: #71869a;
      font-size: 13px;
    }

    .value {
      margin-top: 10px;
      color: #07549a;
      font-size: 24px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .section { margin-top: 25px; }

    h2 {
      font-size: 17px;
      color: #07549a;
    }

    .transaction {
      padding: 14px 0;
      border-bottom: 1px solid #e7eff5;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 14px;
    }

    .transaction:last-child { border-bottom: 0; }

    .muted {
      color: #71869a;
      font-size: 12px;
      margin-top: 5px;
    }

    .message {
      padding: 14px;
      color: #71869a;
      font-size: 14px;
    }

    @media (max-width: 380px) {
      body { padding: 14px; }
      .value { font-size: 20px; }
    }
  </style>
</head>

<body>

<header>
  <div>
    <h1>MT ROYAL WASH</h1>
    <div class="subtitle">Espace Employé</div>
  </div>
  <button class="logout" id="logoutButton">Déconnexion</button>
</header>

<div class="grid">
  <div class="card">
    <div class="label">Lavages aujourd'hui</div>
    <div class="value" id="dailyWashes">—</div>
  </div>

  <div class="card">
    <div class="label">Recette du jour</div>
    <div class="value" id="dailyRevenue">—</div>
  </div>
</div>

<section class="section">
  <h2>Mes dernières transactions</h2>
  <div class="card" id="history">
    <div class="message">Chargement...</div>
  </div>
</section>

<script>
  const SUPABASE_URL =
    "https://cgilxwdxiakfriroixih.supabase.co";

  const HISTORY_URL =
    SUPABASE_URL + "/functions/v1/employee-history";

  const SESSION_KEY = "mtRoyalWashEmployeeSession";

  let session = null;

  try {
    session = JSON.parse(
      sessionStorage.getItem(SESSION_KEY) || "null"
    );
  } catch {
    session = null;
  }

  if (
    !session ||
    !session.access_token ||
    !session.user ||
    session.user.role !== "employee"
  ) {
    window.location.replace("index.html");
  }

  document.getElementById("logoutButton")
    .addEventListener("click", () => {
      sessionStorage.removeItem(SESSION_KEY);
      window.location.replace("index.html");
    });

  function formatMoney(value) {
    return Number(value || 0).toLocaleString("fr-FR") + " FCFA";
  }

  function formatDate(value) {
    return new Date(value).toLocaleString("fr-FR", {
      day: "2-digit",
      month: "2-digit",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    });
  }

  async function loadHistory() {
    const historyBox = document.getElementById("history");

    try {
      const response = await fetch(HISTORY_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + session.access_token
        },
        body: JSON.stringify({})
      });

      const data = await response.json();

      if (!response.ok || data.success !== true) {
        throw new Error(
          data.error || "Chargement impossible."
        );
      }

      document.getElementById("dailyWashes").textContent =
        data.stats.dailyWashes ?? 0;

      document.getElementById("dailyRevenue").textContent =
        formatMoney(data.stats.dailyRevenue);

      historyBox.replaceChildren();

      if (!Array.isArray(data.history) || data.history.length === 0) {
        const empty = document.createElement("div");
        empty.className = "message";
        empty.textContent =
          "Aucune transaction pour le moment.";

        historyBox.appendChild(empty);
        return;
      }

      data.history.forEach((item) => {
        const row = document.createElement("div");
        row.className = "transaction";

        const left = document.createElement("div");

        const vehicle = document.createElement("strong");
        vehicle.textContent = item.vehicle_type || "Véhicule";

        const details = document.createElement("div");
        details.className = "muted";
        details.textContent =
          formatDate(item.created_at) +
          " · " + (item.payment_method || "Paiement");

        left.append(vehicle, details);

        const amount = document.createElement("strong");
        amount.textContent = formatMoney(item.amount);

        row.append(left, amount);
        historyBox.appendChild(row);
      });

    } catch (error) {
      historyBox.textContent =
        error.message || "Erreur de chargement.";
    }
  }

  if (session && session.access_token) {
    loadHistory();
  }
</script>

</body>
</html>
