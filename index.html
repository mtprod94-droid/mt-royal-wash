<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 35px 20px;
    font-family: 'DM Sans', sans-serif;
    color: #12304b;

/* ANIMATED WATER BACKGROUND */

.water {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
}

.bubble {

    box-shadow: inset -3px -4px 10px rgba(75,165,220,.12);
    animation: rise linear infinite;
}

    width: 24px;
    height: 24px;
    left: 8%;
    animation-duration: 13s;
}

.bubble:nth-child(2) {

    height: 13px;
    left: 23%;
    animation-duration: 17s;
    animation-delay: 3s;
}

.bubble:nth-child(3) {

    left: 72%;
    animation-duration: 15s;
    animation-delay: 2s;
}

.bubble:nth-child(4) {

    left: 88%;
    animation-duration: 12s;
    animation-delay: 5s;
}

.bubble:nth-child(5) {
    width: 11px;

    left: 52%;
    animation-duration: 18s;
    animation-delay: 1s;
}

.bubble:nth-child(6) {

    animation-delay: 7s;
}

    left: 15%;
    animation-duration: 11s;
    animation-delay: 2s;
}

.bubble:nth-child(8) {

    height: 35px;
    left: 30%;
    animation-duration: 19s;
    animation-delay: 5s;
}

.bubble:nth-child(9) {
    width: 10px;
    height: 10px;
    left: 45%;
    animation-duration: 12s;
    animation-delay: 1s;
}

.bubble:nth-child(10) {
    width: 23px;
    height: 23px;
    left: 60%;
    animation-duration: 16s;
    animation-delay: 4s;
}

.bubble:nth-child(11) {
    width: 14px;
    height: 14px;
    left: 80%;
    animation-duration: 13s;
    animation-delay: 6s;
}

.bubble:nth-child(12) {
    width: 30px;

    animation-duration: 18s;
    animation-delay: 3s;
}

.bubble:nth-child(13) {

    left: 5%;

    animation-delay: 8s;
}

.bubble:nth-child(14) {

    left: 38%;

    animation-delay: 9s;
}

.bubble:nth-child(15) {
    width: 28px;
    height: 28px;
    left: 68%;
    animation-duration: 20s;
    animation-delay: 7s;
}

.bubble:nth-child(16) {
    width: 9px;
    height: 9px;
    left: 53%;
    animation-duration: 12s;
    animation-delay: 6s;
}

.bubble:nth-child(17) {
    width: 18px;
    height: 18px;
    left: 90%;
    animation-duration: 17s;
    animation-delay: 10s;
}

.bubble:nth-child(18) {
    width: 25px;
    height: 25px;
    left: 25%;
    animation-duration: 16s;
    animation-delay: 11s;
}

@keyframes rise {
    0% {
        transform: translateY(0) translateX(0);
        opacity: 0;
    }
    15% {
        opacity: .8;
    }
    85% {
        opacity: .7;
    }
    100% {
        transform: translateY(-115vh) translateX(35px);
        opacity: 0;
    }
}

/* WATER WAVES */

.waves {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 200%;
    height: 110px;
    pointer-events: none;
    opacity: .35;
    background:
        radial-gradient(ellipse at 50% 100%,
        #68bde8 0%, #a9ddf5 55%, transparent 70%);
    animation: waveMove 9s ease-in-out infinite alternate;
}

@keyframes waveMove {
    from { transform: translateX(-10%) translateY(12px); }
    to { transform: translateX(-30%) translateY(-8px); }
}

/* PREMIUM IRIDESCENT SOAP BUBBLES */

.soap-bubble {
    position: fixed;
    z-index: 1;
    pointer-events: none;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.9);

    background:
        radial-gradient(circle at 28% 24%,
            rgba(255,255,255,.95) 0 3%,
            transparent 13%),
        radial-gradient(circle at 72% 75%,
            rgba(90,210,255,.24),
            transparent 35%),
        radial-gradient(circle at 30% 80%,
            rgba(255,170,220,.22),
            transparent 40%),
        radial-gradient(circle at 65% 25%,
            rgba(160,225,255,.30),
            transparent 42%),
        rgba(255,255,255,.10);

    box-shadow:
        inset 3px 3px 9px rgba(255,255,255,.9),
        inset -4px -5px 12px rgba(100,180,230,.20),
        0 0 12px rgba(255,255,255,.35);

    animation: soapFloat 12s ease-in-out infinite;
}

.soap-bubble::after {
    content: "";
    position: absolute;
    top: 18%;
    left: 22%;
    width: 22%;
    height: 12%;
    border-radius: 50%;
    background: rgba(255,255,255,.9);
    filter: blur(2px);
    transform: rotate(-35deg);
}

.soap-bubble.one {
    width: 45px;
    height: 45px;
    left: 7%;
    bottom: 12%;
}

.soap-bubble.two {
    width: 28px;
    height: 28px;
    right: 9%;
    bottom: 22%;
    animation-delay: 3s;
}

.soap-bubble.three {
    width: 58px;
    height: 58px;
    right: 17%;
    bottom: 8%;
    animation-delay: 5s;
}

.soap-bubble.four {
    width: 35px;
    height: 35px;
    left: 22%;
    bottom: 30%;
    animation-delay: 2s;
}

@keyframes soapFloat {
    0%, 100% {
        transform: translateY(0) translateX(0) scale(1);
    }
    50% {
        transform: translateY(-24px) translateX(9px) scale(1.06);
    }
}

/* LUXURY WASH FOAM */

.foam {
    position: fixed;
    bottom: -25px;
    left: -5%;
    width: 110%;
    height: 75px;
    z-index: 1;
    pointer-events: none;
    opacity: .75;
    background:
        radial-gradient(circle at 5% 70%, white 0 22px, transparent 23px),
        radial-gradient(circle at 12% 55%, #fff 0 30px, transparent 31px),
        radial-gradient(circle at 22% 75%, white 0 24px, transparent 25px),
        radial-gradient(circle at 34% 60%, #fff 0 32px, transparent 33px),
        radial-gradient(circle at 48% 75%, white 0 25px, transparent 26px),
        radial-gradient(circle at 61% 55%, #fff 0 30px, transparent 31px),
        radial-gradient(circle at 75% 70%, white 0 27px, transparent 28px),
        radial-gradient(circle at 89% 55%, #fff 0 32px, transparent 33px),
        radial-gradient(circle at 98% 75%, white 0 25px, transparent 26px);
    animation: foamMove 7s ease-in-out infinite alternate;
}

@keyframes foamMove {
    from { transform: translateX(-8px); }
    to { transform: translateX(12px); }
}

/* MAIN CONTENT */

.container {
    width: 100%;
    max-width: 430px;
    position: relative;
    z-index: 2;
    text-align: center;
}

/* CAR SYMBOL */

.car-icon {
    width: 90px;
    height: 90px;
    margin: 0 auto 17px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: rgba(255,255,255,.75);
    border: 1px solid rgba(88,170,220,.25);
    box-shadow: 0 10px 35px rgba(44,120,170,.12);
    animation: float 4s ease-in-out infinite;
}

.car-icon svg {
    width: 57px;
    height: 57px;
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
}

/* BRAND */

.logo {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(27px, 8vw, 36px);
    font-weight: 700;
    letter-spacing: 1.5px;
    color: #123c61;
}

.brand {
    font-size: 11px;
    letter-spacing: 4px;
    color: #5487aa;
    margin-top: 9px;
    font-weight: 600;
}

.tagline {
    font-size: 12px;
    color: #63849d;
    margin-top: 16px;
    letter-spacing: .4px;
}

.line {
    width: 55px;
    height: 2px;
    background: linear-gradient(90deg, #65bde8, #17618f);
    margin: 27px auto;
    border-radius: 5px;
}

/* LOGIN CARD */

.card {
    background: rgba(255,255,255,.82);
    border: 1px solid rgba(255,255,255,.95);
    border-radius: 22px;
    padding: 34px 25px;
    box-shadow:
        0 20px 55px rgba(40,100,140,.13),
        inset 0 1px 0 #fff;
    backdrop-filter: blur(12px);
}

h2 {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 24px;
    color: #174b72;
    margin-bottom: 11px;
}

.subtitle {
    font-size: 13px;
    color: #7994a9;
    margin-bottom: 27px;
    line-height: 1.6;
}

/* INPUTS */

input {
    width: 100%;
    padding: 16px;
    margin-bottom: 15px;
    border-radius: 11px;
    border: 1px solid #d6e8f3;
    background: rgba(255,255,255,.95);
    color: #173d59;
    font-family: inherit;
    font-size: 15px;
    outline: none;
    transition: .3s;
}

input:focus {
    border-color: #55a9d8;
    box-shadow: 0 0 0 3px rgba(85,169,216,.12);
}

input::placeholder {
    color: #a2b8c8;
}

/* BUTTON */

button {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 11px;
    background: linear-gradient(135deg, #287eae, #124c76);
    color: white;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1.2px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(26,91,135,.2);
    transition: .3s;
}

button:active {
    transform: scale(.98);
}

button:disabled {
    opacity: .6;
    cursor: wait;
}

#message {
    min-height: 22px;
    margin-top: 17px;
    font-size: 13px;
    color: #c04b4b;
}

.footer {
    margin-top: 27px;
    color: #7292a9;
    font-size: 10px;
    letter-spacing: 1.5px;
    line-height: 1.8;
}

.hidden {
    display: none;
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
    }
}
</style>
</head>

<body>

        </p>

                type="password"
                id="password"

        </p>

            SE DÉCONNECTER
        </button>

    </div>

<script>
const LOGIN_URL =
"https://cgilxwdxiakfriroixih.supabase.co/functions/v1/username-login";

const form = document.getElementById("loginForm");
const button = document.getElementById("loginButton");
const message = document.getElementById("message");

let currentSession = null;

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    button.disabled = true;
    button.textContent = "CONNEXION...";
    message.textContent = "";

    try {

        const response = await fetch(LOGIN_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username: username,
                password: password
            })
        });

        const data = await response.json();

        if (!response.ok || !data.access_token) {
            throw new Error(
                data.error || "Identifiants incorrects."
            );
        }

        currentSession = data;

        document.getElementById("loginCard")
            .classList.add("hidden");

        document.getElementById("dashboard")
            .classList.remove("hidden");

        document.getElementById("welcomeUser")
            .textContent = "Utilisateur : " + data.user.username;

        document.getElementById("password").value = "";

    } catch (error) {

        message.textContent =
            error.message || "Erreur de connexion.";

    } finally {

        button.disabled = false;
        button.textContent = "SE CONNECTER";

    }

});

function logout() {

    currentSession = null;

    document.getElementById("dashboard")
        .classList.add("hidden");

    document.getElementById("loginCard")
        .classList.remove("hidden");

    document.getElementById("username").value = "";
    document.getElementById("password").value = "";

    message.textContent = "";
}
</script>
