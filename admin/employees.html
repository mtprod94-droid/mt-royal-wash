<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#eef6ff">
  <title>Gestion des employés | MT ROYAL WASH</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(145deg, #eaf4ff, #ffffff);
      color: #17324d;
      min-height: 100vh;
    }

    header {
      background: #ffffff;
      padding: 18px 20px;
      border-bottom: 1px solid #dce9f5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      font-size: 20px;
      font-weight: 800;
      color: #1261a0;
    }

    .subtitle {
      font-size: 12px;
      color: #688198;
      margin-top: 4px;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 12px 16px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    .logout {
      background: #edf4fa;
      color: #31516e;
    }

    main {
      width: min(100% - 28px, 950px);
      margin: 25px auto;
    }

    .back {
      display: inline-block;
      color: #1769aa;
      text-decoration: none;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .panel {
      background: white;
      padding: 22px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(30, 80, 120, 0.07);
      border: 1px solid #e1edf7;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 8px;
    }

    h2 {
      font-size: 19px;
      margin: 0 0 18px;
    }

    .muted {
      color: #71869a;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d4e2ef;
      border-radius: 9px;
      font-size: 16px;
      background: #fbfdff;
      color: #17324d;
    }

    input:focus {
      outline: 2px solid #8bc4f4;
      border-color: #398bd0;
    }

    .primary {
      background: #1672b9;
      color: white;
      margin-top: 15px;
    }

    .primary:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .employee {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 16px 0;
      border-bottom: 1px solid #e8eff5;
    }

    .employee:last-child {
      border-bottom: 0;
    }

    .employee-name {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 5px;
    }

    .employee-info {
      font-size: 13px;
      color: #71869a;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-top: 6px;
    }

    .active {
      background: #e2f8ec;
      color: #168047;
    }

    .inactive {
      background: #ffeded;
      color: #c33d3d;
    }

    .activate {
      background: #e1f7e9;
      color: #168047;
    }

    .deactivate {
      background: #fff0e7;
      color: #b45b23;
    }

    .employee button {
      white-space: nowrap;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 9px;
      margin-top: 14px;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .success {
      display: block;
      background: #e5f8ed;
      color: #176d3b;
    }

    .error {
      display: block;
      background: #fff0f0;
      color: #b42f2f;
    }

    .empty {
      color: #71869a;
      padding: 20px 0;
      text-align: center;
    }

    footer {
      text-align: center;
      color: #8497a8;
      font-size: 12px;
      padding: 25px 10px;
    }

    @media (max-width: 600px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .panel {
        padding: 18px;
      }

      .employee {
        align-items: flex-start;
      }

      .employee button {
        padding: 10px;
        font-size: 12px;
      }

      h1 {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

<header>
  <div>
    <div class="brand">MT ROYAL WASH</div>
    <div class="subtitle">ESPACE ADMINISTRATEUR</div>
  </div>

  <button class="logout" id="logoutButton">Déconnexion</button>
</header>

<main>

  <a class="back" href="dashboard.html">← Retour au tableau de bord</a>

  <section class="panel">
    <h1>Gestion des employés</h1>
    <p class="muted">
      Ajouter, consulter et gérer les accès de vos employés.
    </p>
  </section>

  <section class="panel">
    <h2>➕ Ajouter un employé</h2>

    <form id="employeeForm">
      <div class="form-grid">
        <input
          id="fullName"
          type="text"
          placeholder="Nom complet"
          required
        >

        <input
          id="username"
          type="text"
          placeholder="Nom d'utilisateur"
          required
        >

        <input
          id="phone"
          type="tel"
          placeholder="Téléphone"
          required
        >

        <input
          id="password"
          type="password"
          placeholder="Mot de passe"
          minlength="6"
          required
        >
      </div>

      <button class="primary" id="createButton" type="submit">
        Créer le compte employé
      </button>
    </form>

    <div id="formMessage" class="message"></div>
  </section>

  <section class="panel">
    <h2>👥 Liste des employés</h2>

    <button class="primary" id="refreshButton" type="button">
      Actualiser la liste
    </button>

    <div id="employeeList" style="margin-top:18px">
      <div class="empty">Chargement des employés...</div>
    </div>

    <div id="listMessage" class="message"></div>
  </section>

</main>

<footer>
  BY MAISON TRAORÉ · Votre véhicule mérite le meilleur.
</footer>

<script>
  const SUPABASE_FUNCTIONS =
    "https://cgilxwdxiakfriroixih.supabase.co/functions/v1/";

  const SESSION_KEY = "mtRoyalWashAdminSession";

  let session;

  try {
    session = JSON.parse(sessionStorage.getItem(SESSION_KEY));
  } catch (error) {
    session = null;
  }

  if (
    !session ||
    !session.access_token ||
    !session.user ||
    session.user.role !== "admin"
  ) {
    window.location.href = "index.html";
  }

  const employeeList = document.getElementById("employeeList");
  const listMessage = document.getElementById("listMessage");
  const formMessage = document.getElementById("formMessage");
  const createButton = document.getElementById("createButton");

  function showMessage(element, message, type) {
    element.textContent = message;
    element.className = "message " + type;
  }

  function clearMessage(element) {
    element.textContent = "";
    element.className = "message";
  }

  async function apiRequest(functionName, method = "GET", body = null) {
    const options = {
      method,
      headers: {
        "Authorization": "Bearer " + session.access_token,
        "Content-Type": "application/json"
      }
    };

    if (body !== null) {
      options.body = JSON.stringify(body);
    }

    const response = await fetch(
      SUPABASE_FUNCTIONS + functionName,
      options
    );

    const data = await response.json();

    if (!response.ok || data.error || data.success === false) {
      throw new Error(data.error || "Une erreur est survenue.");
    }

    return data;
  }

  async function loadEmployees() {
    employeeList.innerHTML =
      '<div class="empty">Chargement des employés...</div>';

    clearMessage(listMessage);

    try {
      const data = await apiRequest("admin-list-employees");

      const employees = data.users || [];

      if (employees.length === 0) {
        employeeList.innerHTML =
          '<div class="empty">Aucun employé enregistré.</div>';
        return;
      }

      employeeList.innerHTML = "";

      employees.forEach(employee => {
        const row = document.createElement("div");
        row.className = "employee";

        const details = document.createElement("div");

        const name = document.createElement("div");
        name.className = "employee-name";
        name.textContent = employee.full_name || "Sans nom";

        const info = document.createElement("div");
        info.className = "employee-info";
        info.textContent =
          "Utilisateur : " + (employee.username || "—") +
          "\nTéléphone : " + (employee.phone || "—");

        info.style.whiteSpace = "pre-line";

        const status = document.createElement("span");
        status.className =
          "status " + (employee.is_active ? "active" : "inactive");

        status.textContent =
          employee.is_active ? "Actif" : "Inactif";

        details.appendChild(name);
        details.appendChild(info);
        details.appendChild(status);

        const button = document.createElement("button");

        button.className =
          employee.is_active ? "deactivate" : "activate";

        button.textContent =
          employee.is_active ? "Désactiver" : "Activer";

        button.type = "button";

        button.addEventListener("click", () => {
          changeEmployeeStatus(employee);
        });

        row.appendChild(details);
        row.appendChild(button);

        employeeList.appendChild(row);
      });

    } catch (error) {
      employeeList.innerHTML = "";
      showMessage(listMessage, error.message, "error");
    }
  }

  async function changeEmployeeStatus(employee) {
    const action = employee.is_active ? "désactiver" : "activer";

    const confirmed = confirm(
      "Voulez-vous vraiment " + action + " le compte de " +
      employee.full_name + " (" + employee.username + ") ?"
    );

    if (!confirmed) return;

    try {
      await apiRequest("manage-employee-status", "POST", {
        employee_id: employee.id,
        is_active: !employee.is_active
      });

      showMessage(
        listMessage,
        "Le statut de l'employé a été mis à jour.",
        "success"
      );

      await loadEmployees();

    } catch (error) {
      showMessage(listMessage, error.message, "error");
    }
  }

  document.getElementById("employeeForm").addEventListener(
    "submit",
    async function(event) {
      event.preventDefault();

      clearMessage(formMessage);
      createButton.disabled = true;
      createButton.textContent = "Création en cours...";

      const employee = {
        full_name: document.getElementById("fullName").value.trim(),
        username: document.getElementById("username").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        password: document.getElementById("password").value
      };

      try {
        await apiRequest("create-employee", "POST", employee);

        showMessage(
          formMessage,
          "Le compte employé a été créé avec succès.",
          "success"
        );

        this.reset();
        await loadEmployees();

      } catch (error) {
        showMessage(formMessage, error.message, "error");

      } finally {
        createButton.disabled = false;
        createButton.textContent = "Créer le compte employé";
      }
    }
  );

  document.getElementById("refreshButton").addEventListener(
    "click",
    loadEmployees
  );

  document.getElementById("logoutButton").addEventListener(
    "click",
    function() {
      sessionStorage.removeItem(SESSION_KEY);
      window.location.href = "index.html";
    }
  );

  loadEmployees();
</script>

</body>
</html>
