<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eaf6ff">
  <title>MT ROYAL WASH | Dashboard Admin</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #18324f;
      background: #edf6fc;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    h1 {
      margin: 0;
      color: #1769aa;
      font-size: 22px;
    }

    .subtitle {
      margin-top: 6px;
      color: #7892a8;
      font-size: 12px;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 12px 16px;
      color: white;
      background: #1769aa;
      font-weight: bold;
      cursor: pointer;
    }

    .logout { background: #d9534f; }

    .menu {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 22px;
    }

    .menu button {
      min-height: 65px;
      text-align: left;
      line-height: 1.4;
      background: white;
      color: #1769aa;
      border: 1px solid #dceaf4;
      box-shadow: 0 5px 18px rgba(30,90,130,.06);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .card, .panel {
      padding: 18px;
      border: 1px solid #dceaf4;
      border-radius: 15px;
      background: white;
      box-shadow: 0 5px 18px rgba(30,90,130,.06);
    }

    .label {
      color: #7892a8;
      font-size: 12px;
    }

    .value {
      margin-top: 10px;
      color: #1769aa;
      font-size: 23px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .panel { margin-top: 22px; }

    h2 {
      margin: 0 0 15px;
      font-size: 17px;
    }

    #vehicles {
      color: #627d92;
      font-size: 13px;
      line-height: 1.8;
    }

    #message {
      margin-top: 18px;
      color: #b44;
      font-size: 13px;
    }

    @media (max-width: 360px) {
      .cards, .menu {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>
    <div>
      <h1>MT ROYAL WASH</h1>
      <div class="subtitle">ESPACE ADMINISTRATEUR</div>
    </div>

    <button class="logout" id="logoutButton">
      Déconnexion
    </button>
  </header>

  <nav class="menu">
    <button id="employeesButton">
      👥 Gestion des employés
    </button>

    <button type="button" disabled>
      📋 Historique – Bientôt disponible
    </button>

    <button id="expensesButton" type="button">
💰 Gestion des dépenses
</button>

    <button type="button" disabled>
      📊 Rapports – Bientôt disponible
    </button>

    <button type="button" disabled>
      ⚙️ Paramètres – Bientôt disponible
    </button>
  </nav>

  <section class="cards">

    <div class="card">
      <div class="label">Chiffre d'affaires du jour</div>
      <div class="value" id="revenue">—</div>
    </div>

    <div class="card">
      <div class="label">Véhicules lavés aujourd'hui</div>
      <div class="value" id="washes">—</div>
    </div>

    <div class="card">
      <div class="label">Dépenses du jour</div>
      <div class="value" id="expenses">—</div>
    </div>

    <div class="card">
      <div class="label">Bénéfice du jour</div>
      <div class="value" id="profit">—</div>
    </div>

  </section>

  <section class="panel">
    <h2>Derniers véhicules enregistrés</h2>
    <div id="vehicles">Chargement...</div>
  </section>

  <div id="message" role="status" aria-live="polite"></div>

  <script>
    const API_URL =
      "https://cgilxwdxiakfriroixih.supabase.co/functions/v1/admin-dashboard";

    const savedSession =
      sessionStorage.getItem("mtRoyalWashAdminSession");

    let loginData = null;

    try {
      loginData = JSON.parse(savedSession);
    } catch {
      loginData = null;
    }

    if (
      !loginData ||
      !loginData.access_token ||
      !loginData.user ||
      loginData.user.role !== "admin"
    ) {
      window.location.replace("index.html");
    }

    function formatCFA(amount) {
      return Number(amount || 0).toLocaleString("fr-FR") + " FCFA";
    }

    async function loadDashboard() {
      const message = document.getElementById("message");

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + loginData.access_token
          },
          body: JSON.stringify({})
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          if (response.status === 401 || response.status === 403) {
            sessionStorage.removeItem("mtRoyalWashAdminSession");
            window.location.replace("index.html");
            return;
          }

          throw new Error(data.message || "Chargement impossible.");
        }

        const stats = data.stats || {};

        document.getElementById("revenue").textContent =
          formatCFA(stats.dailyRevenue);

        document.getElementById("washes").textContent =
          Number(stats.dailyWashes || 0);

        document.getElementById("expenses").textContent =
          formatCFA(stats.dailyExpenses);

        document.getElementById("profit").textContent =
          formatCFA(stats.dailyProfit);

        const vehicles = data.vehicles || [];
        const vehicleBox = document.getElementById("vehicles");

        if (vehicles.length === 0) {
          vehicleBox.textContent = "Aucun véhicule enregistré.";
        } else {
          vehicleBox.replaceChildren();

          vehicles.forEach(function(vehicle) {
            const row = document.createElement("div");
            const type = document.createElement("strong");
            const price = document.createElement("span");

            type.textContent = vehicle.vehicle_type || "Véhicule";
            price.textContent = " — " + formatCFA(vehicle.price);

            row.append(type, price);
            vehicleBox.appendChild(row);
          });
        }

      } catch (error) {
        message.textContent =
          "Erreur : " + (error.message || "Connexion impossible.");
      }
    }

    document.getElementById("employeesButton").addEventListener(
      "click",
      function() {
        window.location.href = "employees.html";
      }
    );

document.getElementById("expensesButton").addEventListener(
  "click",
  function() {
    window.location.href = "expenses.html";
  }
);

    document.getElementById("logoutButton").addEventListener(
      "click",
      function() {
        sessionStorage.removeItem("mtRoyalWashAdminSession");
        window.location.replace("index.html");
      }
    );

    if (loginData && loginData.access_token) {
      loadDashboard();
    }
  </script>

</body>
</html>
